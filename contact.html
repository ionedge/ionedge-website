<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">اتصل بنا | أيون إيدج للحلول الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        html[lang="en"] body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased relative overflow-x-hidden">

    <!-- خلفيات مضيئة متفاعلة -->
    <div class="absolute top-0 right-1/4 w-[500px] h-[500px] bg-blue-600/15 rounded-full blur-[120px] -z-10 animate-pulse"></div>
    <div class="absolute top-1/3 left-1/4 w-[500px] h-[500px] bg-indigo-500/15 rounded-full blur-[120px] -z-10 animate-pulse"></div>
    <div class="absolute bottom-1/4 right-1/3 w-[400px] h-[400px] bg-blue-400/10 rounded-full blur-[100px] -z-10"></div>

    <!-- شريط التنقل العلوي -->
    <header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
            
            <!-- منطقة الشعار -->
            <div class="flex items-center gap-4">
                <a href="index.html" class="flex items-center group">
                    <img src="logoBlue.png" alt="IonEdge Logo" class="h-14 w-auto object-contain group-hover:scale-105 transition duration-300">
                </a>
            </div>
            
            <!-- روابط القائمة -->
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-700">
                <a href="index.html" class="hover:text-blue-600 transition" data-translate="nav-home">الرئيسية</a>
                <a href="portfolio.html" class="hover:text-blue-600 transition" data-translate="nav-portfolio">مشاريعنا</a>
                <a href="index.html#services" class="hover:text-blue-600 transition" data-translate="nav-services">الخدمات</a>
                <a href="contact.html" class="hover:text-blue-600 transition" data-translate="nav-contact">اتصل بنا</a>
            </nav>
            
            <!-- زر تبديل اللغة فقط (بدون زر اطلب استشارة) -->
            <div class="flex items-center gap-4">
                <button onclick="toggleLanguage()" id="lang-btn" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold border border-slate-300 transition shadow-sm">
                    English 🌐
                </button>
            </div>
        </div>
    </header>

    <!-- محتوى صفحة اتصل بنا -->
    <section class="py-24 max-w-4xl mx-auto px-6 relative">
        <div class="text-center mb-16">
            <h1 class="text-4xl font-bold mb-4 text-slate-50" data-translate="contact-heading">تواصل معنا</h1>
            <p class="text-slate-300 font-light" data-translate="contact-subheading">فريقنا مستعد للإجابة عن استفساراتك ودراسة فكرتك البرمجية بكل سرور.</p>
        </div>

        <form action="https://api.web3forms.com/submit" method="POST" class="p-8 lg:p-12 rounded-2xl bg-slate-900/40 backdrop-blur-xl border border-slate-800/80 grid gap-6 shadow-2xl">
            <input type="hidden" name="apikey" value="7ea5d154-9e61-4fae-bd30-8ef6536702ad">

            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-200" data-translate="form-name">الاسم الكريم</label>
                    <input type="text" name="name" required data-translate-placeholder="ph-name" placeholder="أدخل اسمك" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition placeholder:text-slate-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-200" data-translate="form-email">البريد الإلكتروني</label>
                    <input type="email" name="email" required data-translate-placeholder="ph-email" placeholder="name@company.com" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition placeholder:text-slate-500">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-2 text-slate-200" data-translate="form-msg">الرسالة أو تفاصيل المشروع</label>
                <textarea name="message" rows="5" required data-translate-placeholder="ph-msg" placeholder="كيف يمكننا مساعدتك؟" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition placeholder:text-slate-500"></textarea>
            </div>
            
            <input type="hidden" name="redirect" value="https://web3forms.com/success">

            <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold transition shadow-xl" data-translate="form-submit">
                إرسال الطلب
            </button>
        </form>
    </section>

    <!-- التذييل -->
    <footer class="py-12 bg-slate-950/80 backdrop-blur-lg border-t border-slate-800/80 text-center text-sm text-slate-400">
        <p><span data-translate="footer-text">جميع الحقوق محفوظة لشركة</span> <span class="text-blue-400 font-semibold" data-translate="brand">أيون إيدج</span> © 2026</p>
    </footer>

    <!-- سكريبت الترجمة -->
    <script>
        const translations = {
            ar: {
                "brand": "أيون إيدج",
                "nav-home": "الرئيسية", 
                "nav-services": "الخدمات", 
                "nav-portfolio": "مشاريعنا", 
                "nav-contact": "اتصل بنا",
                "cta-consultation": "اطلب استشارة",
                "contact-heading": "تواصل معنا",
                "contact-subheading": "فريقنا مستعد للإجابة عن استفساراتك ودراسة فكرتك البرمجية بكل سرور.",
                "form-name": "الاسم الكريم", 
                "form-email": "البريد الإلكتروني", 
                "form-msg": "الرسالة أو تفاصيل المشروع", 
                "form-submit": "إرسال الطلب",
                "ph-name": "أدخل اسمك", 
                "ph-email": "name@company.com", 
                "ph-msg": "كيف يمكننا مساعدتك؟",
                "footer-text": "جميع الحقوق محفوظة لشركة"
            },
            en: {
                "brand": "IonEdge",
                "nav-home": "Home", 
                "nav-services": "Services", 
                "nav-portfolio": "Portfolio", 
                "nav-contact": "Contact Us",
                "cta-consultation": "Get Consultation",
                "contact-heading": "Contact Us",
                "contact-subheading": "Our team is ready to answer your inquiries and study your software idea with pleasure.",
                "form-name": "Your Name", 
                "form-email": "Email Address", 
                "form-msg": "Message or Project Details", 
                "form-submit": "Send Request",
                "ph-name": "Enter your name", 
                "ph-email": "name@company.com", 
                "ph-msg": "How can we help you?",
                "footer-text": "All rights reserved for"
            }
        };

        let currentLang = localStorage.getItem('ionedge_lang') || 'ar';

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('ionedge_lang', lang);
            const html = document.getElementById('html-root');
            const langBtn = document.getElementById('lang-btn');

            if (lang === 'en') {
                html.setAttribute('lang', 'en');
                html.setAttribute('dir', 'ltr');
                langBtn.textContent = 'العربية 🌐';
            } else {
                html.setAttribute('lang', 'ar');
                html.setAttribute('dir', 'rtl');
                langBtn.textContent = 'English 🌐';
            }

            document.querySelectorAll('[data-translate]').forEach(element => {
                const key = element.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key] !== undefined) {
                    element.textContent = translations[lang][key];
                }
            });

            document.querySelectorAll('[data-translate-placeholder]').forEach(element => {
                const key = element.getAttribute('data-translate-placeholder');
                if (translations[lang] && translations[lang][key] !== undefined) {
                    element.setAttribute('placeholder', translations[lang][key]);
                }
            });
        }

        function toggleLanguage() {
            applyLanguage(currentLang === 'ar' ? 'en' : 'ar');
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyLanguage(currentLang);
        });
    </script>
</body>
</html>
